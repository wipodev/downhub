name: Build and Release DownHub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches VERSION file
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v', 'V')
          $fileVersion = (Get-Content "VERSION" -Raw).Trim().TrimStart('v', 'V')
          if ($tagVersion -ne $fileVersion) {
            Write-Error "Tag version ($tagVersion) does not match VERSION file ($fileVersion). Run 'python build.py --sync' and commit first."
            exit 1
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download official bundled runtimes (yt-dlp, ffmpeg, ffprobe, deno)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin" | Out-Null

          # 1. Download official yt-dlp.exe
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin\yt-dlp.exe"

          # 2. Download official FFmpeg & FFprobe Windows GPL build (BtbN)
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_tmp" -Force
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_tmp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path "ffmpeg_tmp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "bin\ffmpeg.exe"
          Copy-Item $ffprobeExe.FullName -Destination "bin\ffprobe.exe"
          Remove-Item "ffmpeg.zip", "ffmpeg_tmp" -Recurse -Force

          # 3. Download official Deno Windows x64 binary
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "deno_tmp" -Force
          Copy-Item "deno_tmp\deno.exe" -Destination "bin\deno.exe"
          Remove-Item "deno.zip", "deno_tmp" -Recurse -Force

      - name: Build native service, extension zip, and installer
        run: |
          python build.py --ext --inno

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: downhub-windows-artifacts
          path: |
            dist/DownHubService.exe
            dist/DownHub_Installer.exe
            dist/extension.zip

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DownHub ${{ github.ref_name }}
          body: |
            ### 📥 Installation
            Download **`DownHub_Installer.exe`** below and run it to install or update DownHub on Windows.

            ---
          generate_release_notes: true
          files: |
            dist/DownHubService.exe
            dist/DownHub_Installer.exe
            dist/extension.zip
